services:
  db:
    image: postgres:16-alpine
    container_name: gestao-db
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance}
    volumes:
      - gestao_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: gestao-api
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://finance:${DB_PASSWORD:-finance}@db:5432/finance?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET env var with a strong random secret}"
      TOKEN_TTL: "${TOKEN_TTL:-72h}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gestao_db_data:
