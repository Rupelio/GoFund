# fly.toml app configuration file generated for gestao-api on 2026-02-10T11:57:37-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gestao-api'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_CONNECT_RETRIES = '5'
  DB_CONNECT_RETRY_DELAY = '3s'
  DB_MAX_CONNS = '5'
  DB_MIN_CONNS = '1'
  PORT = '8080'
  TOKEN_TTL = '72h'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
